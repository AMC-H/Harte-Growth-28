<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="c01bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101014"/>
      <stop offset="1" stop-color="#0a0a0c"/>
    </linearGradient>
    <linearGradient id="c01funnel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff4d1a" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ff4d1a" stop-opacity=".3"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#c01bg)"/>
  <!-- grid achtergrond -->
  <g stroke="#1a1c24" stroke-width="1">
    <line x1="0" y1="80" x2="640" y2="80" stroke-dasharray="2 6"/>
    <line x1="0" y1="160" x2="640" y2="160" stroke-dasharray="2 6"/>
    <line x1="0" y1="240" x2="640" y2="240" stroke-dasharray="2 6"/>
    <line x1="0" y1="320" x2="640" y2="320" stroke-dasharray="2 6"/>
  </g>
  <!-- funnel bovenkant (breed) -->
  <path d="M 200 80 L 440 80 L 380 240 L 260 240 Z" fill="none" stroke="#25262e" stroke-width="1.5"/>
  <!-- funnel binnenkant: bezoekers die erin gaan -->
  <g fill="#ff4d1a" opacity=".7">
    <circle cx="230" cy="110" r="4"/>
    <circle cx="270" cy="120" r="4"/>
    <circle cx="310" cy="105" r="4"/>
    <circle cx="350" cy="115" r="4"/>
    <circle cx="390" cy="108" r="4"/>
    <circle cx="410" cy="125" r="4"/>
    <circle cx="250" cy="140" r="4"/>
    <circle cx="290" cy="150" r="4"/>
    <circle cx="330" cy="145" r="4"/>
    <circle cx="370" cy="155" r="4"/>
  </g>
  <!-- lek links -->
  <g fill="#ff4d1a">
    <circle cx="180" cy="200" r="5" opacity=".9"/>
    <circle cx="165" cy="230" r="4" opacity=".6"/>
    <circle cx="155" cy="260" r="3" opacity=".4"/>
    <circle cx="150" cy="290" r="2.5" opacity=".25"/>
    <path d="M 200 190 Q 180 200 178 200" stroke="#ff4d1a" stroke-width="1" fill="none" opacity=".4"/>
  </g>
  <!-- lek rechts -->
  <g fill="#ff4d1a">
    <circle cx="460" cy="205" r="5" opacity=".9"/>
    <circle cx="475" cy="235" r="4" opacity=".6"/>
    <circle cx="485" cy="265" r="3" opacity=".4"/>
    <circle cx="490" cy="295" r="2.5" opacity=".25"/>
  </g>
  <!-- funnel onderkant (smal) -->
  <path d="M 260 240 L 380 240 L 355 340 L 285 340 Z" fill="url(#c01funnel)" opacity=".2"/>
  <!-- 1 druppel uit onderkant -->
  <circle cx="320" cy="360" r="4" fill="#ff4d1a" opacity=".7"/>
  <!-- labels -->
  <text x="32" y="48" fill="#8a8b95" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="1.5">N°01 · CONVERSIE</text>
  <text x="32" y="380" fill="#565968" font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="1">100 BEZOEKERS IN . 1 KLANT UIT</text>
</svg>
