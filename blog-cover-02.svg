<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="c02bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101014"/>
      <stop offset="1" stop-color="#0a0a0c"/>
    </linearGradient>
    <radialGradient id="c02pulse" cx="50%" cy="50%">
      <stop offset="0" stop-color="#ff4d1a" stop-opacity=".5"/>
      <stop offset="1" stop-color="#ff4d1a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="400" fill="url(#c02bg)"/>
  <!-- kaart-lijnen (gestileerde routes/straten) -->
  <g stroke="#22252f" stroke-width="1" fill="none">
    <path d="M 0 120 L 240 120 L 280 100 L 400 100 L 440 130 L 640 130"/>
    <path d="M 0 260 L 180 260 L 220 240 L 380 240 L 420 270 L 640 270"/>
    <path d="M 100 0 L 100 200 L 130 240 L 130 400"/>
    <path d="M 320 0 L 320 180 L 350 220 L 350 400"/>
    <path d="M 520 0 L 520 220 L 490 260 L 490 400"/>
  </g>
  <g stroke="#1a1c24" stroke-width="1" stroke-dasharray="1 6" fill="none">
    <path d="M 0 60 L 640 60"/>
    <path d="M 0 340 L 640 340"/>
    <path d="M 60 0 L 60 400"/>
    <path d="M 220 0 L 220 400"/>
    <path d="M 420 0 L 420 400"/>
    <path d="M 580 0 L 580 400"/>
  </g>
  <!-- pulse rond de hoofd-pin -->
  <circle cx="320" cy="210" r="90" fill="url(#c02pulse)"/>
  <circle cx="320" cy="210" r="60" fill="none" stroke="#ff4d1a" stroke-width="1" opacity=".3"/>
  <circle cx="320" cy="210" r="40" fill="none" stroke="#ff4d1a" stroke-width="1" opacity=".5"/>
  <!-- hoofd-pin (jouw bedrijf) -->
  <g transform="translate(320 190)">
    <path d="M 0 -34 C -18 -34 -30 -20 -30 -4 C -30 12 -8 30 0 40 C 8 30 30 12 30 -4 C 30 -20 18 -34 0 -34 Z" fill="#ff4d1a" stroke="#f5f5f7" stroke-width="1.5"/>
    <circle cx="0" cy="-8" r="8" fill="#0a0a0c"/>
  </g>
  <!-- concurrenten (kleinere grijze pins) -->
  <g fill="#3a3b45" opacity=".8">
    <circle cx="120" cy="140" r="6"/>
    <circle cx="480" cy="170" r="6"/>
    <circle cx="180" cy="300" r="6"/>
    <circle cx="500" cy="310" r="6"/>
    <circle cx="440" cy="90" r="6"/>
  </g>
  <!-- labels -->
  <text x="32" y="48" fill="#8a8b95" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="1.5">N°02 · LOKAAL</text>
  <text x="360" y="205" fill="#8a8b95" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing=".8">JIJ, HIER</text>
  <text x="32" y="380" fill="#565968" font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="1">GEVONDEN WORDEN WAAR JE ONDERNEEMT</text>
</svg>
