<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="c03bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101014"/>
      <stop offset="1" stop-color="#0a0a0c"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#c03bg)"/>
  <!-- grid achtergrond -->
  <g stroke="#1a1c24" stroke-width="1" stroke-dasharray="2 6">
    <line x1="0" y1="100" x2="640" y2="100"/>
    <line x1="0" y1="200" x2="640" y2="200"/>
    <line x1="0" y1="300" x2="640" y2="300"/>
  </g>
  <!-- links: intake formulier (afgekort) -->
  <g transform="translate(60 110)">
    <rect x="0" y="0" width="160" height="180" rx="10" fill="#0a0a0c" stroke="#25262e" stroke-width="1"/>
    <text x="14" y="24" fill="#565968" font-family="JetBrains Mono, monospace" font-size="9" letter-spacing="1">INTAKE</text>
    <rect x="14" y="34" width="132" height="20" rx="4" fill="#101014"/>
    <text x="20" y="48" fill="#565968" font-family="Inter, sans-serif" font-size="9">Naam</text>
    <rect x="14" y="62" width="132" height="20" rx="4" fill="#101014"/>
    <text x="20" y="76" fill="#565968" font-family="Inter, sans-serif" font-size="9">Bedrijf</text>
    <rect x="14" y="90" width="132" height="46" rx="4" fill="#101014"/>
    <text x="20" y="104" fill="#565968" font-family="Inter, sans-serif" font-size="9">Vraag</text>
    <rect x="14" y="146" width="132" height="20" rx="4" fill="#ff4d1a"/>
    <text x="80" y="160" fill="#fff" font-family="Inter, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Verstuur</text>
  </g>
  <!-- pijl van formulier naar AI -->
  <g stroke="#ff4d1a" stroke-width="1.5" fill="none">
    <path d="M 230 200 L 290 200" stroke-dasharray="4 4"/>
    <path d="M 285 195 L 292 200 L 285 205"/>
  </g>
  <!-- midden: AI processing node -->
  <g transform="translate(320 160)">
    <rect x="0" y="0" width="120" height="80" rx="14" fill="#0a0a0c" stroke="#ff4d1a" stroke-width="1.2"/>
    <text x="60" y="26" fill="#ff4d1a" font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="1.5" text-anchor="middle">AI</text>
    <text x="60" y="46" fill="#a5a7b0" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">samenvat</text>
    <text x="60" y="62" fill="#a5a7b0" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">+ classificeer</text>
    <!-- pulse -->
    <circle cx="60" cy="40" r="46" fill="none" stroke="#ff4d1a" stroke-width="1" opacity=".2"/>
    <circle cx="60" cy="40" r="60" fill="none" stroke="#ff4d1a" stroke-width="1" opacity=".08"/>
  </g>
  <!-- pijl van AI naar WhatsApp -->
  <g stroke="#ff4d1a" stroke-width="1.5" fill="none">
    <path d="M 450 200 L 510 200" stroke-dasharray="4 4"/>
    <path d="M 505 195 L 512 200 L 505 205"/>
  </g>
  <!-- rechts: WhatsApp bubbel -->
  <g transform="translate(520 130)">
    <rect x="0" y="0" width="90" height="140" rx="14" fill="#0a0a0c" stroke="#25262e" stroke-width="1"/>
    <!-- inkomend bericht -->
    <rect x="8" y="12" width="70" height="26" rx="10" fill="#1a1c24"/>
    <text x="14" y="28" fill="#a5a7b0" font-family="Inter, sans-serif" font-size="8">Nieuwe lead</text>
    <!-- typing dots -->
    <g transform="translate(14 52)" fill="#565968">
      <circle cx="0" cy="4" r="2"/>
      <circle cx="8" cy="4" r="2"/>
      <circle cx="16" cy="4" r="2"/>
    </g>
    <!-- outgoing bericht -->
    <rect x="10" y="72" width="72" height="26" rx="10" fill="#25d366" opacity=".8"/>
    <text x="46" y="88" fill="#fff" font-family="Inter, sans-serif" font-size="8" text-anchor="middle" font-weight="600">Bedankt!</text>
    <text x="46" y="118" fill="#565968" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">30s</text>
  </g>
  <!-- labels -->
  <text x="32" y="48" fill="#8a8b95" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="1.5">N°03 · AI + OPVOLGING</text>
  <text x="32" y="380" fill="#565968" font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="1">FORMULIER → AI → BEVESTIGING IN 30 SEC</text>
</svg>
