<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="c05bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101014"/>
      <stop offset="1" stop-color="#0a0a0c"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#c05bg)"/>
  <!-- grid achtergrond -->
  <g stroke="#1a1c24" stroke-width="1" stroke-dasharray="2 6">
    <line x1="0" y1="80" x2="640" y2="80"/>
    <line x1="0" y1="160" x2="640" y2="160"/>
    <line x1="0" y1="240" x2="640" y2="240"/>
    <line x1="0" y1="320" x2="640" y2="320"/>
  </g>
  <!-- centraal: AI brain/chip -->
  <g transform="translate(270 120)">
    <!-- chip body -->
    <rect x="0" y="0" width="100" height="100" rx="14" fill="#0a0a0c" stroke="#ff4d1a" stroke-width="1.2"/>
    <!-- chip pinnen links -->
    <line x1="-16" y1="20" x2="0" y2="20" stroke="#25262e" stroke-width="2"/>
    <line x1="-16" y1="40" x2="0" y2="40" stroke="#25262e" stroke-width="2"/>
    <line x1="-16" y1="60" x2="0" y2="60" stroke="#25262e" stroke-width="2"/>
    <line x1="-16" y1="80" x2="0" y2="80" stroke="#25262e" stroke-width="2"/>
    <!-- chip pinnen rechts -->
    <line x1="100" y1="20" x2="116" y2="20" stroke="#25262e" stroke-width="2"/>
    <line x1="100" y1="40" x2="116" y2="40" stroke="#25262e" stroke-width="2"/>
    <line x1="100" y1="60" x2="116" y2="60" stroke="#25262e" stroke-width="2"/>
    <line x1="100" y1="80" x2="116" y2="80" stroke="#25262e" stroke-width="2"/>
    <!-- chip pinnen boven -->
    <line x1="20" y1="-16" x2="20" y2="0" stroke="#25262e" stroke-width="2"/>
    <line x1="50" y1="-16" x2="50" y2="0" stroke="#25262e" stroke-width="2"/>
    <line x1="80" y1="-16" x2="80" y2="0" stroke="#25262e" stroke-width="2"/>
    <!-- chip pinnen onder -->
    <line x1="20" y1="100" x2="20" y2="116" stroke="#25262e" stroke-width="2"/>
    <line x1="50" y1="100" x2="50" y2="116" stroke="#25262e" stroke-width="2"/>
    <line x1="80" y1="100" x2="80" y2="116" stroke="#25262e" stroke-width="2"/>
    <!-- AI tekst -->
    <text x="50" y="58" fill="#ff4d1a" font-family="JetBrains Mono, monospace" font-size="22" font-weight="700" text-anchor="middle">AI</text>
    <!-- pulse -->
    <circle cx="50" cy="50" r="60" fill="none" stroke="#ff4d1a" stroke-width="1" opacity=".15"/>
    <circle cx="50" cy="50" r="80" fill="none" stroke="#ff4d1a" stroke-width="1" opacity=".08"/>
  </g>
  <!-- verbindingslijnen naar processen -->
  <!-- links boven: leads -->
  <g stroke="#ff4d1a" stroke-width="1" opacity=".5" fill="none">
    <path d="M 254 150 L 140 100" stroke-dasharray="4 4"/>
  </g>
  <g transform="translate(80 72)">
    <rect x="0" y="0" width="68" height="36" rx="8" fill="#0a0a0c" stroke="#25262e" stroke-width="1"/>
    <text x="34" y="16" fill="#a5a7b0" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Leads</text>
    <text x="34" y="28" fill="#ff4d1a" font-family="JetBrains Mono, monospace" font-size="9" text-anchor="middle">AUTO</text>
  </g>
  <!-- rechts boven: offertes -->
  <g stroke="#ff4d1a" stroke-width="1" opacity=".5" fill="none">
    <path d="M 386 150 L 490 100" stroke-dasharray="4 4"/>
  </g>
  <g transform="translate(460 72)">
    <rect x="0" y="0" width="80" height="36" rx="8" fill="#0a0a0c" stroke="#25262e" stroke-width="1"/>
    <text x="40" y="16" fill="#a5a7b0" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Offertes</text>
    <text x="40" y="28" fill="#ff4d1a" font-family="JetBrains Mono, monospace" font-size="9" text-anchor="middle">AUTO</text>
  </g>
  <!-- links onder: klantenservice -->
  <g stroke="#ff4d1a" stroke-width="1" opacity=".5" fill="none">
    <path d="M 254 210 L 120 270" stroke-dasharray="4 4"/>
  </g>
  <g transform="translate(52 252)">
    <rect x="0" y="0" width="80" height="36" rx="8" fill="#0a0a0c" stroke="#25262e" stroke-width="1"/>
    <text x="40" y="16" fill="#a5a7b0" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Service</text>
    <text x="40" y="28" fill="#ff4d1a" font-family="JetBrains Mono, monospace" font-size="9" text-anchor="middle">AUTO</text>
  </g>
  <!-- rechts onder: admin -->
  <g stroke="#ff4d1a" stroke-width="1" opacity=".5" fill="none">
    <path d="M 386 210 L 510 270" stroke-dasharray="4 4"/>
  </g>
  <g transform="translate(478 252)">
    <rect x="0" y="0" width="80" height="36" rx="8" fill="#0a0a0c" stroke="#25262e" stroke-width="1"/>
    <text x="40" y="16" fill="#a5a7b0" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Admin</text>
    <text x="40" y="28" fill="#ff4d1a" font-family="JetBrains Mono, monospace" font-size="9" text-anchor="middle">AUTO</text>
  </g>
  <!-- onder centraal: content -->
  <g stroke="#ff4d1a" stroke-width="1" opacity=".5" fill="none">
    <path d="M 320 236 L 320 290" stroke-dasharray="4 4"/>
  </g>
  <g transform="translate(280 290)">
    <rect x="0" y="0" width="80" height="36" rx="8" fill="#0a0a0c" stroke="#25262e" stroke-width="1"/>
    <text x="40" y="16" fill="#a5a7b0" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">Content</text>
    <text x="40" y="28" fill="#ff4d1a" font-family="JetBrains Mono, monospace" font-size="9" text-anchor="middle">AUTO</text>
  </g>
  <!-- labels -->
  <text x="32" y="48" fill="#8a8b95" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="1.5">N°05 · AI AUTOMATISERING</text>
  <text x="32" y="380" fill="#565968" font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="1">5 PROCESSEN . 1 SYSTEEM . 0 HANDWERK</text>
</svg>
