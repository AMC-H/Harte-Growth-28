<script>
(function(){
  var heroCard=null;
  function playInHero(id,isShort){
    if(!heroCard)return;
    heroCard.style.aspectRatio=isShort?'9/16':'16/9';
    heroCard.style.maxHeight=isShort?'70vh':'none';
    heroCard.style.margin=isShort?'0 auto':'';

    heroCard.appendChild(iframe);

  function setHeroThumb(id){

    heroCard.style.margin='';
    heroCard.style.width='';

  }
  function makeThumbCard(vid){

    el.style.cssText=vid.short?'width:80px;':'width:100px;';

    return el;
  }
  function init(){
    var heroEl=document.querySelector('.animate-ping-slow');
    if(heroEl){
      heroCard=heroEl.closest('.aspect-video');

        heroCard.style.position='relative';
        heroCard.style.background='#0a0a0a';
        setHeroThumb('SGyXXd32mYc');

        {id:'hDNp_qFBkdA',name:'Short 1',short:true},
        {id:'GsN0zpo7Wzw',name:'Short 2',short:true},
        {id:'MsnzwYn0FBE',name:'Short 3',short:true},
        {id:'YK-yws56paA',name:'Short 4',short:true},
        {id:'8wjNfPIgR2A',name:'Short 5',short:true}
      ];
      row.innerHTML='';
      for(var j=0;j<vids.length;j++){
        row.appendChild(makeThumbCard(vids[j]));
      }
    }
  }
  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',function(){setTimeout(init,200);});}
  else{setTimeout(init,200);}
})();
