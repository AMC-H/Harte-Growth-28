[build]
  publish = "."
  functions = "netlify/functions"

[build.processing.html]
  pretty_urls = true

[functions]
  node_bundler = "esbuild"

# Elke .html URL 301 redirecten naar de schone versie, zodat er één canonieke URL is
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

# De film (tijdelijk op /film/) is nu de homepage
[[redirects]]
  from = "/film"
  to = "/"
  status = 301

[[redirects]]
  from = "/film/"
  to = "/"
  status = 301

[[redirects]]
  from = "/film/*"
  to = "/"
  status = 301

