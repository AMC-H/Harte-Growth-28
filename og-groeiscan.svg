<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0c"/>
      <stop offset="1" stop-color="#14141a"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4d1a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff4d1a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff4d1a" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- radar circles right side -->
  <g transform="translate(920,315)" opacity="0.7">
    <circle r="50" fill="none" stroke="#25262e" stroke-width="1"/>
    <circle r="100" fill="none" stroke="#25262e" stroke-width="1"/>
    <circle r="150" fill="none" stroke="#25262e" stroke-width="1"/>
    <circle r="200" fill="none" stroke="#25262e" stroke-width="1"/>
    <circle r="250" fill="none" stroke="#22252f" stroke-width="1"/>
    <line x1="-250" y1="0" x2="250" y2="0" stroke="#22252f" stroke-width="1"/>
    <line x1="0" y1="-250" x2="0" y2="250" stroke="#22252f" stroke-width="1"/>
    <!-- radar sweep -->
    <path d="M0 0 L250 0 A250 250 0 0 1 176.7 176.7 Z" fill="url(#scanGrad)" opacity="0.35"/>
    <!-- data points -->
    <circle cx="140" cy="-80" r="6" fill="#ff4d1a"/>
    <circle cx="-100" cy="120" r="6" fill="#ff4d1a"/>
    <circle cx="80" cy="160" r="6" fill="#ff4d1a"/>
    <circle cx="-160" cy="-40" r="6" fill="#ff4d1a"/>
    <circle cx="200" cy="60" r="6" fill="#ff4d1a"/>
    <!-- center -->
    <circle r="10" fill="#ff4d1a"/>
    <circle r="14" fill="none" stroke="#ff4d1a" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- text left -->
  <g transform="translate(80,90)">
    <text x="0" y="20" font-family="'JetBrains Mono', monospace" font-size="15" fill="#ff4d1a" letter-spacing="4">GRATIS · GROEISCAN · 60 SEC</text>
  </g>
  <g transform="translate(80,200)">
    <text x="0" y="0" font-family="'Inter', system-ui, sans-serif" font-size="82" font-weight="800" fill="#f5f5f7" letter-spacing="-3">Waar lekt</text>
    <text x="0" y="90" font-family="'Inter', system-ui, sans-serif" font-size="82" font-weight="800" fill="#f5f5f7" letter-spacing="-3">jouw <tspan font-family="'Instrument Serif', Georgia, serif" font-style="italic" fill="#ff4d1a">site</tspan>?</text>
  </g>
  <g transform="translate(80,430)">
    <text x="0" y="0" font-family="'Inter', system-ui, sans-serif" font-size="24" font-weight="500" fill="#a3a5b0" letter-spacing="-.3">Live scan van je website + Google-profiel.</text>
    <text x="0" y="34" font-family="'Inter', system-ui, sans-serif" font-size="24" font-weight="500" fill="#a3a5b0" letter-spacing="-.3">Concrete lekken en fixes in 60 seconden.</text>
  </g>
  <g transform="translate(80,540)">
    <rect x="-4" y="-28" width="380" height="52" rx="26" fill="#ff4d1a"/>
    <text x="26" y="6" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="700" fill="#fff" letter-spacing="-.2">Doe de gratis groeiscan  →</text>
  </g>
  <g transform="translate(80,590)">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="14" fill="#6d6f7a" letter-spacing="2">hartegrowth.eu/groeiscan</text>
  </g>
</svg>
